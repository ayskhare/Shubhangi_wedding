<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
  <a href="#home" class="brand">Wedding Planner</a>
  <button id="lockBtn" class="icon-btn" aria-label="Owner login" hidden>🔒</button>
</header>
<div class="garland" aria-hidden="true"></div>

<div id="scrim" class="scrim"></div>
<nav id="drawer" class="drawer" aria-label="Menu">
  <h2>Menu</h2>
  <a href="#planner" data-close>🛏️ Room Planner</a>
</nav>

<main>
  <section id="home" class="page">
    <video id="vid" src="assets/welcome.mp4" loop playsinline preload="auto"></video>
    <button id="enter" class="enter" hidden>🌸 Tap to begin</button>
  </section>

  <section id="planner" class="page" hidden>
    <div class="summary" id="summary"></div>
    <div class="legend">
      <span><i class="dot vacant"></i>Vacant</span>
      <span><i class="dot booked"></i>Full</span>
      <span><i class="dot partial"></i>Partly filled</span>
      <span><i class="ring bride"></i>Bride side</span>
      <span><i class="ring groom"></i>Groom side</span>
    </div>
    <div id="floors"></div>
    <div id="toast" class="toast" hidden></div>
  </section>
</main>

<nav id="tabs" class="tabs" hidden>
  <button data-b="front">Front</button>
  <button data-b="middle">Middle</button>
  <button data-b="rear">Rear</button>
</nav>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="rooms.js"></script>
<script src="app.js"></script>
</body>
</html>
